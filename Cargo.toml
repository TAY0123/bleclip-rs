[package]
name = "bleclip"
version = "0.4.2"
edition = "2021"
license = "MIT"
description = "Serverless multi-peer encrypted text, image, and file clipboard sync over BLE on Windows and Linux"

[features]
# GUI-subsystem build for the Windows tray launcher (no console window).
tray-gui = []

[dependencies]
anyhow = "1"
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ble-peripheral-rust = "0.2.0"
btleplug = "0.13.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
rand = "0.8.5"
sha2 = "0.10.8"
tokio = { version = "1.44", features = ["full"] }
uuid = { version = "1.11", features = ["v4"] }
x25519-dalek = "2.0.1"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
flate2 = "1"

[profile.release]
lto = "thin"
strip = true

# The Linux KSNI backend supports KDE Plasma/Wayland without GTK libraries.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
x11rb = "0.13"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2"
percent-encoding = "2"
bluer = { version = "0.17.4", features = ["bluetoothd", "l2cap"] }

# The native Win32 tray uses a message pump (no GTK or Tauri dependency).
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
windows = { version = "0.62.2", features = ["Devices_Bluetooth"] }
